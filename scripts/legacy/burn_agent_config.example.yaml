# Omega Burn Agent Configuration
# ================================
# 
# Copy this file to burn_agent_config.yaml and edit as needed.
# The burn agent will load this file if specified with --config.
#
# Environment variables can be referenced using ${VAR_NAME} syntax.

# Cloud Manager Connection
manager_url: ${OMEGA_CLOUD_MANAGER_URL}
token: ${OMEGA_CLOUD_MANAGER_TOKEN}
agent_id: haukur-macbook  # Unique identifier for this agent

# Polling and Timeouts
poll_seconds: 10          # How often to check for new jobs
heartbeat_seconds: 30     # How often to send heartbeat to cloud manager
max_retries: 3            # Retry count for downloads/uploads
request_timeout: 60       # HTTP request timeout

# Disk Management
min_disk_gb: 10           # Minimum free disk space required
max_cache_age_hours: 24   # Clean up cache files older than this
cleanup_on_success: true  # Delete cache files after successful burn

# Directories
cache_dir: /Volumes/Extreme SSD/4_DELIVERY/BURN_CACHE
output_dir: /Volumes/Extreme SSD/4_DELIVERY/VIDEO

# Burn Settings
burn_mode: publisher      # "publisher" (Omega styles) or "basic" (FFmpeg only)
allow_fallback: true      # Fall back to basic FFmpeg if publisher fails

# Default Delivery Profile
# Options: source, 1080p, 720p, 4k, netflix_1080p, netflix_4k, 
#          youtube_1080p, youtube_4k, broadcast_pal, broadcast_ntsc,
#          broadcast_iceland, mac_fast, mac_hevc, instagram, twitter
# Can be overridden per-job via the delivery_profile field
delivery_profile: source

# Logging
log_level: INFO           # DEBUG, INFO, WARNING, ERROR
log_json: false           # Use structured JSON logging
